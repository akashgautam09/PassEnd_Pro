<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="keyGleam" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#3b0764" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#bg)" />
  <rect x="2" y="2" width="28" height="28" rx="7.5" stroke="#c4b4ff" stroke-opacity="0.35" stroke-width="1" />

  <!-- PassEnd Brand Key Icon (Crisp, High Contrast, Centered) -->
  <g filter="url(#softShadow)">
    <!-- Outer ring of key head -->
    <circle cx="11.5" cy="11.5" r="4.25" stroke="url(#keyGleam)" stroke-width="2.3" fill="none" />
    <!-- Center pin of key head -->
    <circle cx="11.5" cy="11.5" r="1.15" fill="#ffffff" />
    
    <!-- Key shaft angled diagonally at 45 degrees -->
    <path d="M14.5 14.5L22.5 22.5" stroke="url(#keyGleam)" stroke-width="2.3" stroke-linecap="round" />
    
    <!-- Primary bit / tooth -->
    <path d="M18.8 18.8L21.4 16.2" stroke="url(#keyGleam)" stroke-width="2.1" stroke-linecap="round" />
    <!-- Secondary bit / tooth -->
    <path d="M21.5 21.5L23.7 19.3" stroke="url(#keyGleam)" stroke-width="2.1" stroke-linecap="round" />
  </g>
</svg>
